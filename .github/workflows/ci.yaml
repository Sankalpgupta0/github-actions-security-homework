
name: Build and Scan Container

on:
  push:

permissions:
  contents: read
  packages: write
  security-events: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      
      - name: Set lowercase image name
        id: image-name
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build, push and scan
        id: container
        uses: ./.github/actions/build-and-scan
        with:
          image_name: ${{ steps.image-name.outputs.name }}
          tag: ${{ github.sha }}
          dockerfile: Dockerfile
          context: .
          build_args: ""


      - name: Print image URI
        env:
          IMAGE_URI: ${{ steps.container.outputs.image_uri }}
        run: 'echo "Published image: $IMAGE_URI"'
