
name: Build, Push and Scan
description: Build a Docker image, push it to GHCR, and scan it with Trivy

inputs:
  image_name:
    description: Full container image name, including registry
    required: true

  tag:
    description: Image tag
    required: true

  dockerfile:
    description: Path to the Dockerfile
    required: false
    default: Dockerfile

  context:
    description: Docker build context
    required: false
    default: .

  build_args:
    description: Newline-separated Docker build arguments
    required: false
    default: ""

outputs:
  image_uri:
    description: Full URI of the pushed Docker image
    value: ${{ steps.image.outputs.image_uri }}

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ${{ inputs.image_name }}:${{ inputs.tag }}
        build-args: ${{ inputs.build_args }}

    - name: Set image URI output
      id: image
      shell: bash
      run: |
        echo "image_uri=${{ inputs.image_name }}:${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

    - name: Scan image with Trivy
      uses: aquasecurity/trivy-action@0.35.0
      with:
        image-ref: ${{ inputs.image_name }}:${{ inputs.tag }}
        format: sarif
        output: trivy-results.sarif
        severity: CRITICAL,HIGH,MEDIUM,LOW,UNKNOWN
        exit-code: "0"

    - name: Upload Trivy SARIF results
      uses: github/codeql-action/upload-sarif@v3
      if: always() && hashFiles('trivy-results.sarif') != ''
      with:
        sarif_file: trivy-results.sarif
